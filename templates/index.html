<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 YouTube Shorts Bot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 YouTube Shorts Bot</h1>
            <p class="subtitle">Cole o link e a IA faz o resto</p>
        </header>

        <section class="card">
            <label for="url_baixo">🔽 Link do vídeo de reação</label>
            <input type="url" id="url_baixo" placeholder="https://www.instagram.com/reel/..." autocomplete="off">

            <div class="opcoes">
                <label class="radio">
                    <input type="radio" name="modo" value="agora" checked>
                    <span>🚀 Postar agora</span>
                </label>
                <label class="radio">
                    <input type="radio" name="modo" value="agendar">
                    <span>📅 Agendar</span>
                </label>
            </div>

            <div id="agendamento" class="agendamento escondido">
                <label>Data e hora:</label>
                <input type="datetime-local" id="data_agendamento">
            </div>

            <button id="btn-criar" onclick="criarVideo()">
                ✨ CRIAR VÍDEO
            </button>
        </section>

        <section id="progresso" class="card escondido">
            <h2>📊 Status</h2>
            <div class="barra-container">
                <div id="barra" class="barra"></div>
            </div>
            <p id="msg-progresso">Iniciando...</p>
        </section>

        <section id="resultado" class="card escondido">
            <h2>✅ Pronto!</h2>
            <p><strong>Título:</strong> <span id="res-titulo"></span></p>
            <p><strong>Frase:</strong> <span id="res-frase"></span></p>
            <p><strong>Vídeo:</strong> <span id="res-video"></span></p>
        </section>

        <section class="card">
            <h2>📋 Últimos vídeos</h2>
            <div id="historico-lista">
                {% if historico %}
                    {% for item in historico %}
                    <div class="item-historico">
                        <span class="status-dot concluido"></span>
                        <div>
                            <strong>{{ item.titulo }}</strong>
                            <small>{{ item.data[:16] }}</small>
                        </div>
                    </div>
                    {% endfor %}
                {% else %}
                    <p class="vazio">Nenhum vídeo criado ainda.</p>
                {% endif %}
            </div>
        </section>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
