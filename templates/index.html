<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Super IA</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>🤖 Super IA</h1>
            <button onclick="limparChat()" class="btn-limpar">🗑️ Limpar</button>
        </header>

        <div id="chat-mensagens" class="chat-mensagens">
            <div class="msg-ia">
                <div class="balao">
                    Oi! Sou sua IA pessoal. Como posso ajudar?
                </div>
            </div>
        </div>

        <div class="chat-input">
            <input type="text" id="msg-input" placeholder="Digite sua mensagem..." autocomplete="off" autofocus>
            <button onclick="enviarMensagem()" id="btn-enviar">➤</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
